name: Flutter & Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate Liquid golden baselines and commit them'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Show golden update mode
        run: |
          echo "Workflow event: ${{ github.event_name }}"
          echo "Update goldens: ${{ github.event.inputs.update_goldens || 'false' }}"

      - name: Analyze
        run: bash scripts/flutter_analyze_ci.sh

      - name: Regenerate Liquid goldens
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_goldens == 'true'
        run: flutter test --update-goldens test/liquid_visual_test.dart

      - name: Commit updated Liquid goldens
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_goldens == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/goldens/preview_*.png
          if git diff --cached --quiet; then
            echo 'Liquid goldens are already current.'
          else
            git commit -m 'Test: update Liquid golden baselines'
            git push
          fi

      - name: Test
        run: flutter test --reporter compact

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
