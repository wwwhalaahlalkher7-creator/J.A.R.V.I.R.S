name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: bash scripts/flutter_analyze_ci.sh

      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-analyze-log
          path: ${{ runner.temp }}/jarvis-flutter-analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee "${RUNNER_TEMP}/jarvis-flutter-test.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-test-log
          path: ${{ runner.temp }}/jarvis-flutter-test.log
          if-no-files-found: ignore
          retention-days: 7
